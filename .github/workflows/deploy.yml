name: Deploy to Cloudflare Pages

# Auto-deploy: any edit pushed to the main branch is rebuilt and
# published to https://droyce-tech-club.pages.dev within ~2 minutes.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Build static site
        run: bun run build:static
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Deploy to Cloudflare Pages
        run: |
          bunx wrangler pages deploy out \
            --project-name=droyce-tech-club \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Auto-deploy from GitHub"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
